schema: spec-driven
language: zh-CN

context: |
  项目类型：agent cli
  技术栈
  后端：Golang
  架构原则
  - 遵循 Clean Architecture
  - 服务保持无状态（Stateless）
  - 优先组合而不是继承
  - 模块之间避免强耦合
  - 进行模块设计时优先考虑能否复用已有模块，如果没有那么在设计新模块时要考虑设计模式和未来的复用性
  - 服务内部通用功能优先设计为独立模块（如认证、日志、错误处理、通用响应等），通常 放在 internal/模块名
  - 工具函数优先设计为纯函数，避免副作用，便于测试和复用
  - 跟业务无关的功能通常放在 pkg/模块名 下; 为了方便后续复用 不应该import 项目路径下的 package
  开发行为准则（Karpathy）
  - 代码修改后需使用 LSP(gopl) 验证直至无误
  - 编码前明确关键假设；若需求有歧义，需列出可选解释并说明取舍
  - 不实现未被明确要求的功能、配置或抽象
  - 仅修改与当前需求直接相关的代码（外科手术式改动）
  - 不顺手重构无关模块；发现问题可记录但不在同变更处理
  - 每项改动必须有可验证成功标准
  代码质量规范
  - 所有导出函数必须包含函数文档, 且符合golang函数文档规范
  - 较为重要的非导出函数/逻辑较多的函数 也应添加函数文档
  - 除测试用例外，生产代码禁止使用 print；输出诊断信息应使用日志模块，运行时校验应显式抛出业务或参数异常
  组件规范
  - 每个组件保持单一职责
  - 页面组件放 pages
  - 通用组件放 components
  - 业务组件放 features
  日志规范
  - 使用 pkg/logger 包输出日志
  - 所有关键业务操作必须记录日志
  - 错误必须记录 error log
  - API 请求必须记录 request id
  安全规范
  - 禁止存储明文密码
  - 使用 bcrypt 进行密码加密
  - 必须校验所有用户输入
  - 登录接口必须进行限流
  模块设计规范
  - 每个模块必须有清晰职责
  - 避免跨模块直接调用数据库
  - 模块之间通过 service 层通信
  - 数据库相关操作，可以复用的方法集中在 service orm层，提高代码复用及实现数据库操作和业务逻辑的分离
  - 禁止在 controller 中写业务逻辑
  数据库设计规范
  - 使用规范化设计避免数据冗余
  - 所有表必须包含 created_at 和 updated_at 字段
  - 使用 UUID 作为主键
  - 必须设计合理的索引以优化查询性能
  - 不要使用 外键, 仅存储逻辑外键, 在应用层添加判断逻辑; 外键策略优先沿用现有模型风格，新增变更必须说明取舍与一致性策略

rules:
  changes:
    - 必须使用中文完成文档的编辑
    - change 目录必须位于 openspec/changes/
    - 推荐格式：change—YYYYMMDD-NNN-verb-target，保证有序，方便溯源
    - 一个 change 只对应一个独立需求、问题修复或架构调整
    - 每个 change 至少包含 proposal.md、tasks.md、specs/
    - 涉及架构、API、数据库、权限、状态机或跨模块变更时必须包含 design.md
    - specs/ 下允许多个 spec，必须按依赖关系或实现顺序编号
    - spec 目录格式：spec-NN-capability-name，保证有序，方便溯源
    - 一个 spec 只描述一个独立能力
    - spec 之间依赖应保持单向，禁止循环依赖
    - design.md 必须说明 spec 之间的关系与依赖
    - tasks.md 必须可追溯到对应 spec 或 Requirement
    - change 完成后归档用于溯源，不得删除
    - 废弃 change 必须说明原因，不得直接删除

  proposal:
    - 必须使用中文完成文档的编辑
    - 必须包含章节：Why、What、Impact、Non-goals
    - proposal 应保持精炼；为明确边界、假设、兼容性和迁移风险时允许适度超过 500 字（可以有一定的冗余）
    - 避免实现细节，重点说明能力变化与边界变化
    - 必须列出关键假设、歧义取舍与最小改动理由
    - 必须标注受影响模块（src/<模块名>/testing/database/devops/docs）
    - 必须说明 API 兼容性影响、配置变更风险、数据迁移风险
    - 必须声明 change 创建日期、当前状态与关联需求来源
    - change 状态必须明确，可选值为 draft、active、implemented、validated、archived
    - active 状态表示允许进入实现
    - implemented 状态表示代码已完成，但不等于验收完成
    - validated 状态表示代码、测试、文档与验收场景均已闭环
    - archived 状态表示变更已归档，不应继续修改；如需继续迭代，应新建 change

  specs:
    - 每个 spec 需要使用中文编写
    - 每个 spec 必须对应一个独立能力或领域边界
    - 每个 spec 目录必须使用有序命名，推荐格式：NN-capability-name
    - 每个 Requirement 必须使用 Gherkin 场景（Given / When / Then）
    - Requirement 描述系统行为，不描述框架实现
    - 每个 Requirement 必须原子化且可独立测试
    - 每个 Requirement 至少包含一个成功场景
    - 每个能力至少包含一个失败场景（鉴权失败/参数错误/资源不存在/超时或取消）
    - 涉及 API 必须明确 method、path、认证方式、关键请求响应字段
    - 存在多个 spec 时，必须能从编号看出主要依赖顺序或实现顺序
    - 禁止为了排序频繁修改已有 spec 编号，避免破坏历史溯源

  design:
    - 必须使用中文完成文档的编辑
    - 必须包含章节：Architecture、Components、APIs、Data Model
    - 必须说明与现有模块的集成点、边界与替代关系
    - 必须包含错误处理策略与安全设计
    - 必须说明为何是最小实现路径
    - 涉及数据库变更必须给出 migration 与回滚方案
    - 涉及高风险动作必须说明权限边界、审计方式与失败降级策略
    - 当 change 下存在多个 spec 时，必须说明 spec 之间的依赖关系、执行顺序与边界划分
    - 当 spec 之间存在前置依赖时，必须说明依赖原因与失败降级策略

  tasks:
    - 必须使用中文完成文档的编辑
    - 每个任务应拆分为 1-2 小时可完成的粒度
    - 任务必须区分 backend / frontend / database / testing
    - 必须包含编写测试的任务
    - 必须包含更新文档的任务
    - 涉及生产代码实现时必须包含禁止使用 print 和 assert 的静态验收步骤（测试用例除外）
    - 避免一个任务同时修改多个无关模块
    - 每个任务必须声明验证方式（自动化命令或手工验收路径）
    - 每个任务必须可追溯到对应需求、spec 编号与受影响模块
    - 涉及数据库变更必须包含 migration 编写、执行与回滚验证
    - 多 spec change 中，tasks 应按 spec 编号或依赖顺序组织
    - 跨 spec 的任务必须明确说明依赖来源和影响范围
